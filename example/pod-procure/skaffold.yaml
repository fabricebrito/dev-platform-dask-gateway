apiVersion: skaffold/v4beta9
kind: Config
metadata:
  name: procure

build:
  artifacts:
    - image: procure
      context: .
      docker:
        dockerfile: Dockerfile.procure
    - image: bai
      context: bai
      docker:
        dockerfile: Dockerfile

deploy:
  helm:
    releases:
      - name: procurement
        chartPath: charts
        namespace: dask-gateway
        setValueTemplates:
          daskWorkerImage: "{{.IMAGE_REPO_bai}}:{{.IMAGE_TAG_bai}}"
          daskGatewayProcureImage: "{{.IMAGE_REPO_procure}}:{{.IMAGE_TAG_procure}}"
          daskGatewayUrl: "http://traefik-dask-gateway.dask-gateway.svc.cluster.local:80"
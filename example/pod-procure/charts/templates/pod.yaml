apiVersion: v1
kind: Pod
metadata:
  name: dask-cluster-with-cleanup
spec:
  restartPolicy: Never
  volumes:
  - name: shared-data
    emptyDir: {}  # Shared volume between containers
  # mount the config map with the Dask Gateway config
  - name: dask-gateway-config
    configMap:
      name: dask-gateway-config
  - name: dask-gateway-config-1
    configMap:
      name: dask-gateway-config
  initContainers:
  - name: init-dask-cluster
    image: {{ .Values.daskGatewayProcureImage }}
    env: 
    - name: PYTHONPATH
      value: "/app"
    command:
      - python
      - /app/init-dask.py
      - --target
      - /shared/dask_cluster_name.txt
    volumeMounts:
    - name: shared-data
      mountPath: /shared
    - name: dask-gateway-config
      mountPath: /etc/dask

  containers:
  - name: main-container
    image: {{ .Values.daskWorkerImage }}
    
    env: 
    - name: PYTHONPATH
      value: "/app"
    command:
      - sh
      - -c
      - |
        python -m app --pre_fire_url "https://earth-search.aws.element84.com/v0/collections/sentinel-s2-l2a-cogs/items/S2B_10TFK_20210713_0_L2A" --post_fire_url "https://earth-search.aws.element84.com/v0/collections/sentinel-s2-l2a-cogs/items/S2A_10TFK_20210718_0_L2A" && touch /shared/completed
    volumeMounts:
    - name: shared-data
      mountPath: /shared
    - name: dask-gateway-config
      mountPath: /etc/dask

  - name: sidecar-cleanup
    image: {{ .Values.daskGatewayProcureImage }}

    env: 
    - name: PYTHONPATH
      value: "/app"
    command:
      -  python
      - /app/dispose-dask.py
      - --source
      - /shared/dask_cluster_name.txt
      - --signal
      - /shared/completed        

    volumeMounts:
    - name: shared-data
      mountPath: /shared
    - name: dask-gateway-config-1 # it doesn't allow mounting the same config map twice
      mountPath: /etc/dask
